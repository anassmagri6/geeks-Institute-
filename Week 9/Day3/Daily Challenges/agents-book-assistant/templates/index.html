<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agents Book Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; }
        textarea { resize: none; }
    </style>
</head>
<body class="bg-white text-neutral-950 antialiased">
<main class="mx-auto flex min-h-[100dvh] max-w-[922px] flex-col px-5 pt-6 sm:px-7 sm:pt-7">

    <header class="flex items-start justify-between gap-4 border-b border-neutral-100 pb-5">
        <div>
            <h1 class="text-2xl font-medium">AI Agents Book Assistant</h1>
            <p class="mt-1 text-base text-neutral-500">Ask questions about “Introduction to Agents”.</p>
        </div>
        <button id="new-chat" type="button"
            class="flex h-11 items-center gap-2 rounded-full border border-neutral-200 bg-white px-4 text-sm text-neutral-700 transition hover:bg-neutral-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            New chat
        </button>
    </header>

    <section id="conversation" aria-label="Conversation" aria-live="polite"
             class="flex flex-1 flex-col gap-6 py-8"></section>

    <div class="sticky bottom-0 bg-white pb-4 pt-2">
        <p id="status" role="status" class="mb-2 hidden text-sm text-red-700"></p>
        <form id="composer"
              class="rounded-[26px] bg-[#f1f1f1] p-4 focus-within:ring-2 focus-within:ring-blue-200">
            <label for="message" class="sr-only">Your message</label>
            <textarea id="message" rows="2" maxlength="4000"
                placeholder="Ask anything about the book..."
                class="block max-h-48 w-full bg-transparent text-lg leading-7 outline-none placeholder:text-neutral-500"></textarea>
            <div class="mt-2 flex items-end justify-between gap-4">
                <span class="text-xs text-neutral-500">Enter to send · Shift + Enter for a new line</span>
                <button id="send" type="submit" aria-label="Send message"
                    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[#1648ee] text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-40">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
        </form>
        <p class="mt-2 text-center text-xs text-neutral-400">
            Local learning project · No authentication · Do not use real sensitive data.
        </p>
    </div>
</main>

<script>
    const STORAGE_KEY = "agents-book-conversation-id";
    const form = document.getElementById("composer");
    const input = document.getElementById("message");
    const conversation = document.getElementById("conversation");
    const status = document.getElementById("status");
    const send = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    let busy = false;
    let conversationId = localStorage.getItem(STORAGE_KEY);

    const welcomeHtml = `
        <div id="welcome" class="my-auto text-center">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v12H7l-3 3V4z"/>
                </svg>
            </div>
            <h2 class="text-xl font-medium">Ask about the book</h2>
            <p class="mt-2 text-neutral-500">Answers cite page numbers when possible.</p>
        </div>`;

    function updateSend() { send.disabled = busy || !input.value.trim(); }
    function showError(msg) { status.textContent = msg; status.classList.remove("hidden"); }
    function clearError() { status.textContent = ""; status.classList.add("hidden"); }

    function addMessage(text, role, meta) {
        document.getElementById("welcome")?.remove();
        const row = document.createElement("div");
        row.className = role === "user" ? "flex justify-end" : "flex justify-start";
        const bubble = document.createElement("div");
        bubble.className = role === "user"
            ? "max-w-[85%] whitespace-pre-wrap break-words rounded-[24px] bg-[#f1f1f1] px-5 py-3 text-[17px] leading-7"
            : "max-w-full whitespace-pre-wrap break-words px-1 py-2 text-[17px] leading-7";
        bubble.textContent = text;
        row.appendChild(bubble);
        if (meta) {
            const m = document.createElement("div");
            m.className = "mt-1 text-xs text-neutral-400";
            m.textContent = meta;
            row.appendChild(m);
        }
        conversation.appendChild(row);
        row.scrollIntoView({ behavior: "smooth", block: "nearest" });
        return row;
    }

    async function api(path, options = {}) {
        const res = await fetch(path, {
            headers: { "Content-Type": "application/json" },
            ...options,
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
            throw new Error(data?.error || data?.message || `Request failed (${res.status})`);
        }
        return data;
    }

    async function ensureConversation() {
        if (conversationId) return conversationId;
        const data = await api("/api/conversations", { method: "POST" });
        conversationId = data.conversation.id;
        localStorage.setItem(STORAGE_KEY, conversationId);
        return conversationId;
    }

    async function loadConversation() {
        conversation.innerHTML = welcomeHtml;
        if (!conversationId) return;
        try {
            const data = await api(`/api/conversations/${conversationId}`);
            conversation.replaceChildren();
            if (!data.messages.length) {
                conversation.innerHTML = welcomeHtml;
                return;
            }
            data.messages.forEach((m) => addMessage(m.content, m.role));
        } catch {
            // ID غير صالح → ابدأ محادثة جديدة
            localStorage.removeItem(STORAGE_KEY);
            conversationId = null;
        }
    }

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 192) + "px";
        updateSend();
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            form.requestSubmit();
        }
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        if (location.protocol === "file:") {
            showError("Open this page via http://localhost:5000/ to use the chat.");
            return;
        }

        clearError();
        addMessage(text, "user");
        input.value = "";
        input.style.height = "auto";
        busy = true; updateSend(); newChatBtn.disabled = true;

        const pending = addMessage("Thinking…", "assistant");
        pending.classList.add("text-neutral-500");

        try {
            const id = await ensureConversation();
            const data = await api(`/api/conversations/${id}/messages`, {
                method: "POST",
                body: JSON.stringify({ content: text }),
            });
            pending.remove();
            const pages = [...new Set(
                (data.sources || []).map((s) => s.page).filter((p) => p != null)
            )].sort((a, b) => a - b);
            addMessage(
                data.message.content,
                "assistant",
                pages.length ? `Pages: ${pages.join(", ")}` : null
            );
        } catch (err) {
            pending.remove();
            showError("Could not get a response: " + (err.message || "Unknown error"));
        } finally {
            busy = false; newChatBtn.disabled = false;
            updateSend(); input.focus();
        }
    });

    newChatBtn.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        conversationId = null;
        conversation.innerHTML = welcomeHtml;
        clearError(); input.value = ""; input.style.height = "auto";
        updateSend(); input.focus();
    });

    loadConversation();
    updateSend();
</script>
</body>
</html>
