<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Full-Stack Bootcamp Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>AI Full-Stack Bootcamp</h1>
    <p>Ask about the program, or say <em>“I want to register”</em>.</p>
  </header>

  <main>
    <div id="chat" role="log" aria-live="polite" aria-label="Conversation"></div>

    <form id="form">
      <label for="msg" class="sr-only">Your message</label>
      <input id="msg" name="msg" autocomplete="off" placeholder="Type your message..." required>
      <button type="submit" id="send">Send</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="error" role="alert" hidden></div>

    <button type="button" id="new">New conversation</button>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
